<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Styling with classListt</title>

    <style>
        .outer {
            width: 90%;
            border: 1px solid black;
            margin-left: auto;
            margin-right: auto;
            background-color: red;
        }
    </style>
</head>
<body>
    <div id="container">
        <p>
            Lorem ipsum dolor, sit amet consectetur adipisicing elit. Officiis eaque rem ipsam nam quisquam quis laboriosam eveniet labore quia. Maiores reiciendis dolore quisquam quia dicta est? Dolore quos repellat ipsa voluptate autem possimus, deleniti accusantium iste labore dolorum maiores reprehenderit?
        </p>
    </div>

    <script>
        const container = document.getElementById('container');
        container.classList.add('outer');
    </script>
    
</body>
</html>
