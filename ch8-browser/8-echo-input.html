<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo App</title>
</head>
<body>
    <input 
        id="text" 
        type="text" 
        oninput="echoText()">                       
        <!-- event oninput - handler echoText() -->
    <p id="output"></p>                             
    <!--  updated value εμφανίζεται εδώ -->

    <script>
        function echoText() {
            // Input
            const inputVal = document.getElementById('text').value;    
            
            // Output στο <p>
            const output = document.getElementById('output');
            output.textContent = inputVal;                   
        }
    </script>
    
</body>
</html>
