<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FETCH API Get Request</title>
</head>
<body>

    <h1>Fetch API</h1>
    <button type="button" onclick="fetchOneObj()">
        Fetch One Object
    </button>
    <p id="responseText"></p>


    <script>
        function fetchOneObj() {

            // GET default
            fetch('https://jsonplaceholder.typicode.com/posts/1')
                .then((response) => {
                    // checks 200 -299 - καλύπτει μόνο τα HTTP errors
                    if (!response.ok) {
                    throw new Error(`HTTP error. Status: ${response.status}`)
                    }
                    // parse το json string σε JS Object
                    return response.json()
                })
                // έχει γίνει JS Object γι'αυτο document.get..
                .then(data => {
                    document.getElementById('responseText').textContent = 
                    `Title: ${data.title}`;
                })
                // καλύπτει και τα network error & οτιδήποτε άλλο προκύψει
                .catch(error => console.error("Error: " + error.message));
        };
    </script>
</body>
</html>
